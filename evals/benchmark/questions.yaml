# Retrieval benchmark: labelled questions with the date they are asked for and the documents that answer them.
# A question is a hit@k when any expected document is among the top k passages. `answerable: false` questions are
# about things the corpus does not cover; they calibrate the abstention threshold.
# Kinds: fact, rule (rule ids and codes as exact tokens), version (the answer depends on which document version is in
# force on as_of), obligation (an obligation date announced by a document), compare, bg (asked in Bulgarian), none.
default_as_of: 2026-05-15

questions:
