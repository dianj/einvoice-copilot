# Key facts of the fictional world: the single source of truth for the corpus, the rules and the evals.
# Every fact names the document that states it and a regular expression that must match that document's text
# (checked by tests/test_corpus.py), so the documents cannot drift from these values.

VD.b2g_from:
  value: 2025-01-01
  doc: VD-LAW-01
  pattern: 'business-to-government.{0,80}1 January 2025'
VD.b2b_large_from:
  value: 2026-01-01
