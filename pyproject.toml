[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# FastAPI declares request parameters with calls in default arguments (Depends(), File(), Form()).
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Prompts are prose: long lines read better than wrapped sentences.
"copilot/graph/prompts.py" = ["E501"]
