name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      # The app's dependencies from the lock (exact versions, every file checked against its hash).
      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt

      # Fails on any new known vulnerability. The ignored ones are explained in SECURITY.md.
      - name: Audit dependencies
        run: >-
          pip install pip-audit==2.10.1 &&
          pip-audit -r requirements.lock --require-hashes --disable-pip --progress-spinner off
          --ignore-vuln PYSEC-2026-311 --ignore-vuln PYSEC-2026-3813
          --ignore-vuln PYSEC-2026-3814 --ignore-vuln PYSEC-2026-3815

      - name: Install the Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Lint
        run: ruff check .

      # No GPU or LM Studio in CI: everything external has a fake.
      - name: Run tests with coverage
        run: >-
          python -m pytest -v
          --cov=copilot --cov=server --cov-report=term-missing
          --tracing=retain-on-failure --screenshot=only-on-failure --output=test-results

      - name: Upload Playwright traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/

  docker:
    runs-on: ubuntu-latest
    # A cold build downloads the 240 MB embedding model from Hugging Face, which is slow from CI (~13 min);
    # later builds take that layer from the GitHub Actions cache.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: einvoice-copilot
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # /api/health answers as soon as the server runs; /api/ready once the embedder and the index are warm.
      - name: Start it and check /api/health and /api/ready
        run: |
          docker run -d --name app -p 8000:8000 einvoice-copilot
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/ready; then
              curl -fsS http://127.0.0.1:8000/api/health; exit 0
            fi
            sleep 2
          done
          docker logs app
          exit 1
