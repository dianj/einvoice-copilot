name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Install the Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Lint
        run: ruff check .

      # No GPU or LM Studio in CI: everything external has a fake.
      - name: Run tests with coverage
        run: >-
          python -m pytest -v
          --cov=copilot --cov=server --cov-report=term-missing
          --tracing=retain-on-failure --screenshot=only-on-failure --output=test-results

      - name: Upload Playwright traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-traces
          path: test-results/

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t einvoice-copilot .

      - name: Start it and check /api/health
        run: |
          docker run -d --name app -p 8000:8000 einvoice-copilot
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1
